<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Codename - Word Game</title>
    <link rel="stylesheet" href="style.css">
    <!-- Vue 3 CDN (production, no build tools needed) -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
</head>
<body>
    <!-- Vue mount point - all pages rendered dynamically here -->
    <div id="app"></div>

    <!-- ===== Vue Application Scripts (load order matters) ===== -->
    <script src="js/store.js"></script>
    <script src="js/api.js"></script>
    <script src="js/components/WelcomePage.js"></script>
    <script src="js/components/LobbyPage.js"></script>
    <script src="js/components/WaitingRoomPage.js"></script>
    <script src="js/components/GameBoardPage.js"></script>
    <script src="js/app.js"></script>
    <script>
        /**
         * Auto-reconnect: if player exists in localStorage, skip welcome page.
         * Runs after Vue app is mounted so store is available.
         */
        document.addEventListener('DOMContentLoaded', () => {
            const savedPlayer = localStorage.getItem('player');
            if (savedPlayer) {
                try {
                    const parsed = JSON.parse(savedPlayer);
                    if (parsed && parsed.id && parsed.name) {
                        store.player = parsed;
                        store.page = 'lobby';
                    }
                } catch (e) {
                    localStorage.removeItem('player');
                }
            }
        });
    </script>
</body>
</html>
